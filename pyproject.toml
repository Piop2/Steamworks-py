[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "steamworks-py"
version = "0.1.0"
description = "Steamworks SDK 1:1 Python bindings"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["src/steamworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs a running Steam client and steam_appid.txt (AppID 480)"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/steamworks/_native.pyi"]  # generated by nanobind.stubgen

[tool.mypy]
python_version = "3.13"
strict = true
